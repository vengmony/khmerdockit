name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint + Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/khmerdoc-core[dev]
          pip install -e packages/khmerdoc-api[dev]

      - name: Lint (ruff)
        run: |
          python -m ruff check packages/khmerdoc-core packages/khmerdoc-api

      - name: Test (pytest)
        run: |
          python -m pytest -q \
            packages/khmerdoc-core/tests \
            packages/khmerdoc-api/tests \
            --cov=khmerdoc --cov=khmerdoc_api \
            --cov-report=term-missing

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f packages/khmerdoc-api/Dockerfile -t khmerdoc-api:ci .
      - name: Build web image
        run: docker build -f packages/khmerdoc-web/Dockerfile -t khmerdoc-web:ci .
