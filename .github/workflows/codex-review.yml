name: codex-review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review (leave blank for the most recent open PR)"
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  codex-pr-review:
    name: Codex PR review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect target PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 1,
              sort: 'updated',
              direction: 'desc',
            });
            const n = pulls[0]?.number;
            if (!n) {
              core.setFailed('No open PR found.');
              return;
            }
            core.setOutput('number', String(n));

      - name: Run Codex review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::warning::OPENAI_API_KEY secret not set — skipping Codex review."
            echo "codex_review_skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pip install --quiet openai
          python .github/scripts/codex_review.py \
            --pr "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            > /tmp/codex_review.md
          cat /tmp/codex_review.md
          echo "codex_review_path=/tmp/codex_review.md" >> "$GITHUB_OUTPUT"

      - name: Post review comment
        if: env.OPENAI_API_KEY != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          if [ ! -f /tmp/codex_review.md ]; then
            echo "::notice::No review file produced; skipping comment."
            exit 0
          fi
          body=$(cat /tmp/codex_review.md)
          gh pr comment "$PR_NUMBER" --body "$body" || true
