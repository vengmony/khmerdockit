[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "khmerdoc-core"
version = "0.1.0"
description = "KhmerDocKit core: schemas, OCR adapters, rule-based extraction, and Cambodia-specific validators for business documents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KhmerDocKit contributors" }]
keywords = ["khmer", "cambodia", "ocr", "document-ai", "receipts", "invoices"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "pydantic>=2.6",
  "pillow>=10.0",
  "opencv-python-headless>=4.8",
  "numpy>=1.26",
  "python-dateutil>=2.8",
  "click>=8.1",
  "rich>=13.7",
  "typing-extensions>=4.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.3",
  "mypy>=1.8",
  "types-python-dateutil",
]
paddle = ["paddleocr>=2.7"]     # optional, heavy
tesseract = ["pytesseract>=0.3.10"]
easyocr = ["easyocr>=1.7"]      # 80+ languages incl. English
llm = ["httpx>=0.27", "tenacity>=8.2"]
all = [
  "khmerdoc-core[paddle,tesseract,easyocr,llm]",
]

[project.scripts]
khmerdoc = "khmerdoc.cli:main"

[project.urls]
Homepage = "https://github.com/khmerdoc/khmerdockit"
Issues = "https://github.com/khmerdoc/khmerdockit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
khmerdoc = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
